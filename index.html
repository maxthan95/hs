<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Phần mềm điểm danh học sinh</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Firebase SDK -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } 
      from "https://www.gstatic.com/firebasejs/11.0.1/firebase-auth.js";
    import { getDatabase, ref, set, onValue } 
      from "https://www.gstatic.com/firebasejs/11.0.1/firebase-database.js";

    // TODO: Thay cấu hình này bằng config Firebase của bạn
     const firebaseConfig = {
    		apiKey: "AIzaSyBbNvKLgj8QdM22rqxnS65cJGSF5wNUIJE",
    		authDomain: "diem-danh-20xx.firebaseapp.com",
    		projectId: "diem-danh-20xx",
    		storageBucket: "diem-danh-20xx.firebasestorage.app",
    		messagingSenderId: "474588160188",
    		appId: "1:474588160188:web:37a1b187369ff47e56f0b9",
    		measurementId: "G-CYHW7NZKGM"

    // Khởi tạo Firebase
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getDatabase(app);

    // Đăng nhập
    document.addEventListener("DOMContentLoaded", () => {
      const loginForm = document.getElementById("loginForm");
      const logoutBtn = document.getElementById("logoutBtn");

      loginForm.addEventListener("submit", (e) => {
        e.preventDefault();
        const email = document.getElementById("email").value;
        const pass = document.getElementById("password").value;
        signInWithEmailAndPassword(auth, email, pass)
          .then(() => {
            alert("Đăng nhập thành công!");
          })
          .catch(err => alert("Lỗi: " + err.message));
      });

      logoutBtn.addEventListener("click", () => {
        signOut(auth);
      });

      // Theo dõi trạng thái đăng nhập
      onAuthStateChanged(auth, (user) => {
        if (user) {
          document.getElementById("authSection").style.display = "none";
          document.getElementById("appSection").style.display = "block";
        } else {
          document.getElementById("authSection").style.display = "block";
          document.getElementById("appSection").style.display = "none";
        }
      });
    });

    // Ví dụ hàm lưu điểm danh vào Firebase
    window.saveAttendance = function(date, cls, session, records) {
      set(ref(db, `attendance/${cls}/${date}/${session}`), records);
    };

    // Ví dụ hàm lắng nghe realtime
    window.listenAttendance = function(date, cls, session, callback) {
      const attendanceRef = ref(db, `attendance/${cls}/${date}/${session}`);
      onValue(attendanceRef, (snapshot) => {
        callback(snapshot.val());
      });
    };
  </script>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; background:#f9fafb; }
    h2 { color:#4f46e5; }
    .card { background:#fff; padding:20px; margin:20px auto; max-width:500px; border-radius:8px; box-shadow:0 2px 6px rgba(0,0,0,0.1); }
    input { display:block; width:100%; margin:10px 0; padding:10px; border:1px solid #ccc; border-radius:6px; }
    button { padding:10px 16px; border:none; border-radius:6px; cursor:pointer; font-weight:bold; }
    button.primary { background:#4f46e5; color:white; }
    #appSection { display:none; padding:20px; }
  </style>
</head>
<body>
  <!-- Đăng nhập -->
  <div id="authSection" class="card">
    <h2>Đăng nhập giáo viên</h2>
    <form id="loginForm">
      <input type="email" id="email" placeholder="Email" required>
      <input type="password" id="password" placeholder="Mật khẩu" required>
      <button type="submit" class="primary">Đăng nhập</button>
    </form>
  </div>

  <!-- Ứng dụng chính -->
  <div id="appSection">
    <button id="logoutBtn">Đăng xuất</button>
    <h2>Ứng dụng điểm danh</h2>
    <!-- Tại đây bạn nhúng toàn bộ các tab Quản lý học sinh, Điểm danh, Thống kê... 
         (code mình đã gửi ở các bước trước) -->
    <p>👉 Sau khi đăng nhập, toàn bộ các tab quản lý học sinh, điểm danh, thống kê sẽ hiển thị ở đây.</p>
  </div>
</body>
</html>
